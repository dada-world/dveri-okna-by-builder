name: Deploy Staging (dev)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: "/dveri-okna-by-builder"
      NEXT_PUBLIC_FORM_ENDPOINT: "https://submit-form.com/esY14v503"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js export)
        run: npm run build

      - name: Remove CNAME if exists (staging should not use custom domain)
        run: rm -f dist/CNAME

      - name: Deploy to gh-pages-staging branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages-staging
          force_orphan: true
